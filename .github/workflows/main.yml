name: Nova Bot 5H

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create .env File
        run: |
          cat > .env << EOF
          PREFIX=${{ secrets.PREFIX }}
          OWNER_NUMBER=${{ secrets.OWNER_NUMBER }}
          PAIRING_NUMBER=${{ secrets.PAIRING_NUMBER }}
          SESSION_ID=${{ secrets.SESSION_ID }}
          AUTH_DIR=./session
          DOWNLOAD_DIR=./downloads
          BOT_NAME=NOVA MD
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL=llama-3.3-70b-versatile
          AI_AUTO_REPLY=false
          AUTO_STATUS_VIEW=true
          ANTI_LINK=true
          WELCOME=true
          GOODBYE=true
          ALLOWED_LINK_DOMAINS=chat.whatsapp.com
          MAX_DOWNLOAD_MB=50
          PORT=3000
          EOF

      - name: Create Folders
        run: |
          mkdir -p session downloads
          echo "✅ Folders Created"

      - name: Start Bot (5 Hours)
        run: |
          echo "🚀 Nova Bot Starting... (5 Hours)"
          echo "📝 Prefix: ."
          echo "⏰ Will run for 5 hours"
          echo "=================================="
          node src/index.js
          echo "✅ Bot Stopped"
