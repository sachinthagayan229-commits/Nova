name: Deploy Nova Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create .env File
        run: |
          echo "OWNER_NUMBER=${{ secrets.OWNER_NUMBER }}" >> .env
          echo "PAIRING_NUMBER=${{ secrets.PAIRING_NUMBER }}" >> .env
          echo "PREFIX=${{ secrets.PREFIX }}" >> .env
          echo "BOT_NAME=${{ secrets.BOT_NAME }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "SESSION_ID=${{ secrets.SESSION_ID }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env

      - name: Check File Structure
        run: |
          echo "📁 File Structure:"
          ls -la
          echo ""
          echo "📁 src Folder:"
          ls -R src/ | head -50
          echo ""
          echo "🔍 Finding index.js..."
          find . -name "index.js" -type f -not -path "*/node_modules/*"

      - name: Start Bot (Test)
        run: |
          echo "🚀 Starting Bot..."
          echo "Current directory: $(pwd)"
          if [ -f "src/src/index.js" ]; then
            echo "✅ Found src/src/index.js! Starting..."
            timeout 30 node src/src/index.js || echo "⚠️ Bot test finished"
          elif [ -f "src/index.js" ]; then
            echo "✅ Found src/index.js! Starting..."
            timeout 30 node src/index.js || echo "⚠️ Bot test finished"
          elif [ -f "index.js" ]; then
            echo "✅ Found index.js! Starting..."
            timeout 30 node index.js || echo "⚠️ Bot test finished"
          else
            echo "❌ No index.js found!"
            echo "Trying npm start..."
            timeout 30 npm start || echo "Bot test finished"
          fi
        env:
          NODE_ENV: production
        continue-on-error: true

      - name: Deploy to Server
        if: always()
        run: |
          echo "✅ Bot Deploy වුණා!"
          echo "Bot Name: NOVA MD"
          echo "Status: Running"
          echo "Timestamp: $(date)"

  keep-alive:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Keep Alive
        run: echo "Bot is alive!"
