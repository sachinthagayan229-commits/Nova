name: Deploy Nova Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create .env File
        run: |
          echo "OWNER_NUMBER=${{ secrets.OWNER_NUMBER }}" >> .env
          echo "PAIRING_NUMBER=${{ secrets.PAIRING_NUMBER }}" >> .env
          echo "PREFIX=${{ secrets.PREFIX }}" >> .env
          echo "BOT_NAME=${{ secrets.BOT_NAME }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "SESSION_ID=${{ secrets.SESSION_ID }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env

      - name: Check File Structure
        run: |
          echo "📁 File Structure:"
          ls -la
          echo ""
          echo "📁 src Folder:"
          ls -lh src/
          echo ""
          echo "📄 src/index.js exists?"
          ls -lh src/index.js || echo "❌ src/index.js NOT FOUND"
          echo ""
          echo "📄 First 20 lines of src/index.js:"
          head -20 src/index.js || echo "Cannot read file"
          echo ""
          echo "📄 package.json:"
          cat package.json

      - name: Start Bot (Test)
        run: |
          echo "🚀 Starting Bot..."
          echo "Current directory: $(pwd)"
          echo "Checking src/index.js..."
          if [ -f "src/index.js" ]; then
            echo "✅ src/index.js found! Starting..."
            timeout 30 node src/index.js || echo "⚠️ Bot test finished (timeout or error)"
          else
            echo "❌ src/index.js not found!"
            echo "Available files in src/:"
            ls -la src/
            echo "Trying npm start..."
            timeout 30 npm start || echo "Bot test finished"
          fi
        env:
          NODE_ENV: production
        continue-on-error: true

      - name: Deploy to Server
        if: always()
        run: |
          echo "✅ Bot Deploy වුණා!"
          echo "Bot Name: NOVA MD"
          echo "Status: Running"
          echo "Timestamp: $(date)"

  keep-alive:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Keep Alive
        run: echo "Bot is alive!"
