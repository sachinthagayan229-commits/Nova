services:
  - type: web
    name: nova-md-bot
    runtime: node
    plan: starter

    buildCommand: npm install

    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PREFIX
        value: "."

      - key: PORT
        value: "3000"

      - key: SESSION_ID
        sync: false

      - key: OWNER_NUMBER
        sync: false

      - key: PAIRING_NUMBER
        sync: false

      - key: GROQ_API_KEY
        sync: false

    disk:
      name: nova-session
      mountPath: /opt/render/project/src/session
      sizeGB: 1
